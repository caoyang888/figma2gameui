<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>截图拆分检查器 · figma2gameui</title>
<style>@@CSS@@</style>
</head>
<body>
<main>
<header><div class="eyebrow">FIGMA2GAMEUI / SYNTHETIC FIXTURE</div><h1>截图拆分检查器</h1>
<p class="intro muted">用合成截图复现原型：左边看源图定位，中间看节点层级，右边检查看到的尺寸及独立素材。各个视口重新布局，不使用整图缩放代替适配。</p></header>
<details id="fit-fold" open class="panel" style="margin:12px 0"><summary>适配预览</summary>
<div id="scenarios" class="control"></div><p><label><input id="toggle-hits" type="checkbox" checked>显示独立命中区（橙框）</label></p>
<p class="sizeinfo" id="fit-summary"></p><div id="fit-view" style="position:relative;overflow:hidden;background:linear-gradient(#263756,#151c30);border:1px solid #526581;border-radius:12px;margin-top:10px"></div></details>
<nav aria-label="筛选拆分结果"><button data-filter="cut" aria-pressed="false">只看素材</button><button data-filter="all" aria-pressed="true">全部节点</button><button data-filter="todo" aria-pressed="false">动态／待重建</button><a class="button" href="#gallery-section">跳到素材</a><button id="save-tree">下载节点 JSON</button></nav>
<div class="layout">
<section class="panel"><h2>01 · 源图定位</h2><div class="screen" id="screen"><img id="source" alt="合成 UI 样例源图"></div></section>
<section class="panel"><h2>02 · 节点树</h2><div id="tree" aria-label="节点树"></div></section>
<section class="panel inspect" id="inspect"><h2>03 · 节点和素材详情</h2><div id="details"></div></section>
</div>
<section class="section" id="gallery-section"><h2>04 · 透明 PNG</h2><div class="gallery" id="gallery"></div></section>
<section class="panel"><h2>样例图</h2><img id="fit-hero" class="fithero" alt="合成样例的头部"><img id="building-compare" class="fithero" alt="同尺寸透明素材对照"></section>
<p class="muted">此原型读取提供好的节点描述，不自动识别任意截图，也不生成 Creator 预制体。</p>
</main>
<script id="payload" type="application/json">@@FIXTURE@@</script>
<script>@@JS@@</script>
</body>
</html>
